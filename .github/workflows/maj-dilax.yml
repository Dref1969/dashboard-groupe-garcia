name: MAJ DILAX

# CADENCE PILOTÉE PAR GOOGLE APPS SCRIPT (fiable), pas par le scheduler GitHub.
# Le scheduler planifié de GitHub (gratuit, repo public) abandonne régulièrement les
# démarrages, surtout le matin → DILAX restait vide. Désormais un déclencheur Apps Script
# (planificateur Google, lui fiable — il pilote déjà la MAJ 3GWIN toutes les 5 min) appelle
# ce workflow via l'API workflow_dispatch toutes les 30 min, 9h-20h lun-sam. Voir la fonction
# declencherDilaxJour() dans le projet Apps Script "Dashboard Manager Groupe Garcia".
# Le cron ci-dessous n'est qu'un filet de secours best-effort (ex. si le jeton GitHub expire).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,12,16 * * 1-6'   # secours best-effort (la vraie cadence vient de Google)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright + deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run MAJ DILAX (mois + jour)
        env:
          DILAX_USER: ${{ secrets.DILAX_USER }}
          DILAX_PASSWORD: ${{ secrets.DILAX_PASSWORD }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python scripts/maj_dilax.py

      - name: Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: |
            *.png
            *.html
            screenshots/
          if-no-files-found: ignore
          retention-days: 7
