name: MAJ DILAX

# GitHub étrangle fortement les crons "toutes les 30 min" : les workflows PLANIFIÉS
# tournent "au mieux" et, sur un repo public gratuit, la plupart des déclenchements
# (surtout à :00) sont ABANDONNÉS, pas mis en file. Résultat constaté : ~1 run / 2h
# au lieu de toutes les 30 min. La parade : ne plus compter sur 22 déclenchements
# fragiles, mais lancer la journée avec QUELQUES démarrages et BOUCLER dans le job
# (scrape → pause 30 min → scrape …). Il suffit qu'un démarrage survive. Minutes
# Actions gratuites et illimitées sur repo public, donc une boucle longue ne coûte rien.
on:
  # Démarrages Lun-Sam (heure d'été UTC+2 → -2 par rapport à Paris).
  # Le 07:00 + son backup 07:30 garantissent le 1er scrape du matin (purge la veille).
  # 11:00 et 15:00 = relais : un nouveau démarrage prend le relais de la boucle en cours
  # (concurrency ci-dessous), et si un relais est abandonné, la boucle précédente continue.
  schedule:
    - cron: '0 7,11,15 * * 1-6'
    - cron: '30 7 * * 1-6'
  workflow_dispatch:

# Un seul scrape DILAX à la fois : un nouveau démarrage programmé annule la boucle en
# cours et repart proprement (évite deux boucles concurrentes / double-login DILAX).
concurrency:
  group: dilax-jour
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # < 6h (limite dure GitHub qui tuerait le job)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright + deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Boucle scrape DILAX toutes les 30 min jusqu'à 20h Paris
        env:
          DILAX_USER: ${{ secrets.DILAX_USER }}
          DILAX_PASSWORD: ${{ secrets.DILAX_PASSWORD }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          # 1er scrape immédiat, puis toutes les 30 min, tant qu'il est avant 18:00 UTC
          # (= 20h Paris l'été ; 19h l'hiver — compromis volontaire, comme les autres workflows).
          while true; do
            echo "::group::Scrape $(date -u '+%Y-%m-%d %H:%M') UTC"
            python scripts/maj_dilax.py || echo "Scrape KO (on continue, prochain essai dans 30 min)"
            echo "::endgroup::"
            now=$(date -u '+%H%M')
            if [ "$((10#$now))" -ge 1800 ]; then
              echo "20h Paris atteint — fin de la boucle."
              break
            fi
            echo "Pause 30 min avant le prochain scrape…"
            sleep 1800
          done

      - name: Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: |
            *.png
            *.html
            screenshots/
          if-no-files-found: ignore
          retention-days: 7
