name: MAJ Journal Ventes Jour

on:
  # CADENCE PILOTÉE PAR GOOGLE APPS SCRIPT (fiable) : la fonction declencherJournalJour()
  # appelle ce workflow via workflow_dispatch TOUTES LES 5 MIN (9h-20h lun-sam). Le
  # scheduler planifié de GitHub abandonne trop de démarrages pour tenir 5 min (cf. DILAX).
  # Les crons ci-dessous ne sont qu'un filet de secours best-effort.
  schedule:
    - cron: '0,30 7-17 * * 1-6'
    - cron: '0 18 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape 3GWIN -> meilleure_vente.json
        run: python scripts/maj_journal_jour.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meilleure_vente.json
          git diff --staged --quiet && exit 0   # rien de neuf : pas de commit ni de push
          git commit -m "MAJ meilleure vente du jour [auto]"
          git pull --rebase origin main          # éviter les collisions de push à cadence 5 min
          git push
