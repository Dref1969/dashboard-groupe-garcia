name: MAJ Journal Ventes Jour

on:
  # Toutes les 30 min, lun-sam 9h-20h Paris (heure d'été UTC+2 → 7h-18h UTC).
  # Le 1er run de 9h vide le JSON de la veille avant l'ouverture des boutiques.
  schedule:
    - cron: '0,30 7-17 * * 1-6'
    - cron: '0 18 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape 3GWIN -> meilleure_vente.json
        run: python scripts/maj_journal_jour.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meilleure_vente.json
          git diff --staged --quiet || git commit -m "MAJ meilleure vente du jour [auto]"
          git push
