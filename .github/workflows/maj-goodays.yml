name: MAJ Goodays

# CADENCE PILOTÉE PAR GOOGLE APPS SCRIPT (fiable), pas par le scheduler GitHub.
# Le cron GitHub partait avec 2-4h de retard (scheduler best-effort, cf. maj-dilax.yml).
# La fonction declencherGoodays() du projet Apps Script "Dashboard Manager Groupe
# Garcia" (fichier miroir BACKOFFICE/Apps_Script_3GWIN/Declencheur_DILAX.gs) appelle
# ce workflow via l'API workflow_dispatch 1x/jour entre 8h et 9h Paris, lun-sam.
# Le cron ci-dessous n'est qu'un filet de secours best-effort.
on:
  schedule:
    - cron: '0 6 * * 1-6'   # secours best-effort (la vraie cadence vient de Google)
  # Trigger manuel via l'onglet Actions GitHub + dispatch Apps Script
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright + deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run MAJ Goodays
        env:
          GOODAYS_USER: ${{ secrets.GOODAYS_USER }}
          GOODAYS_PASSWORD: ${{ secrets.GOODAYS_PASSWORD }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python scripts/maj_goodays.py

      - name: Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-goodays
          path: |
            *.png
            *.html
          if-no-files-found: ignore
          retention-days: 7
